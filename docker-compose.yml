services:
  immich-autoalbums:
    container_name: immich-autoalbums
    image: ghcr.io/nishantjh/immich_autoalbums:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/app/data
      - IMMICH_URL=${IMMICH_URL}
      - IMMICH_API_KEY=${IMMICH_API_KEY}
      - SCAN_INTERVAL_HOURS=6
      - TZ=UTC
    volumes:
      - ./appdata:/app/data
    labels:
      net.unraid.docker.icon: "https://raw.githubusercontent.com/NishantJh/immich_autoalbums/main/public/icon.png"
      net.unraid.docker.webui: "http://[IP]:[PORT:3000]"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
